name: CI

on:
  # Branches are tested through their pull requests; main after merging
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

# A new push to a pull request cancels the run of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  test:
    # Linux keeps the name of the required check "JDK 25 JVM Tests"
    name: ${{ matrix.os == 'ubuntu-latest' && format('JDK {0} JVM Tests', matrix.java-version) || format('JDK {0} JVM Tests ({1})', matrix.java-version, matrix.os) }}
    strategy:
      matrix:
        java-version: [ 25 ]
        # Linux and Windows on x64, macOS on arm64. The xhandler core is
        # WebAssembly compiled to JVM bytecode: no native code per platform.
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      # The test fixtures (XML, conformance corpus) must keep their LF line endings
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Maven tests
        run: mvn verify -Pexamples

  # Native image: the only check of the GraalVM configuration (core and models)
  quarkus-extension:
    needs: [ test ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ xbuilder, xsender ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven tests
        run: mvn install -DskipTests
      - name: Maven IT tests
        run: mvn -Pnative-image install -f ${{ matrix.module }}/quarkus-extension/integration-tests/

  # The oldest supported Quarkus, in JVM mode: the extensions use little Quarkus
  # API, so this catches incompatibilities without more native builds
  quarkus-supported-v:
    name: quarkus-supported-v (3.33.4.2)
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven install
        run: mvn install -DskipTests
      - name: XBuilder IT tests
        run: mvn install -f xbuilder/quarkus-extension/integration-tests/ -Dquarkus.version=3.33.4.2
      - name: XSender IT tests
        run: mvn install -f xsender/quarkus-extension/integration-tests/ -Dquarkus.version=3.33.4.2

  # The current and the oldest supported Spring Boot
  xsender-springboot-extension:
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven install
        run: mvn install -DskipTests
      - name: IT tests
        run: mvn install -f xsender/spring-boot-extension/integration-tests/
      - name: IT tests (Spring Boot 4.0.9)
        run: mvn install -f xsender/spring-boot-extension/integration-tests/ -Dspringboot.version=4.0.9
