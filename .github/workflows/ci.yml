name: CI

on:
  push:
    branches-ignore:
      - "dependabot/**"
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

env:
  CI: true

jobs:
  test:
    # Linux keeps the name of the required check "JDK 25 JVM Tests"
    name: ${{ matrix.os == 'ubuntu-latest' && format('JDK {0} JVM Tests', matrix.java-version) || format('JDK {0} JVM Tests ({1})', matrix.java-version, matrix.os) }}
    strategy:
      matrix:
        java-version: [ 25 ]
        # Linux and Windows on x64, macOS on arm64. The xhandler core is
        # WebAssembly compiled to JVM bytecode: no native code per platform.
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      # The test fixtures (XML, conformance corpus) must keep their LF line endings
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Maven tests
        run: mvn verify -Pexamples

  quarkus-extension:
    needs: [ test ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ xbuilder, xsender ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven tests
        run: mvn install -DskipTests
      - name: Maven IT tests
        run: mvn -Pnative-image install -f ${{ matrix.module }}/quarkus-extension/integration-tests/

  quarkus-supported-v:
    needs: [ test ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ xbuilder, xsender ]
        quarkus-version: [ 3.33.4.2, 3.39.5 ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven tests
        run: mvn install -DskipTests
      - name: Maven IT tests
        run: mvn -Pnative-image install -f ${{ matrix.module }}/quarkus-extension/integration-tests/ -Dquarkus.version=${{ matrix.quarkus-version }}

  xsender-springboot-extension:
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven tests
        run: mvn install -DskipTests
      - name: Maven IT tests
        run: mvn install -f xsender/spring-boot-extension/integration-tests/

  xsender-springboot-supported-v:
    needs: [ xsender-springboot-extension ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        springboot-version: [ 4.0.9 ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven tests
        run: mvn install -DskipTests
      - name: Maven IT tests
        run: mvn install -f xsender/spring-boot-extension/integration-tests/ -Dspringboot.version=${{ matrix.springboot-version }}
