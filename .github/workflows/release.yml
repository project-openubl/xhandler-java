name: Release

# Runs when a release is published (release-tools' release-xhandler workflow creates it after
# syncing the core of the xhandler-rust release of the same version) and publishes to Maven
# Central with JReleaser. The tag is the version: the poms on main say 6.0.0-SNAPSHOT and this
# workflow sets the tag's version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish again, e.g. v6.0.0-alpha.1"
        required: true
        type: string

# release-tools finds the run of a release by this name
run-name: Release ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  maven-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-java@v6.3.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # A release carries the core released by xhandler-rust as the same version (release-tools
      # checks it too, before tagging)
      - run: make verify-release TAG="$TAG"
      # Maven Central never replaces a version: a rerun after publishing skips the rest
      - name: Check Maven Central
        id: central
        run: |
          if curl -sfI "https://repo1.maven.org/maven2/io/github/project-openubl/xhandler-core/$VERSION/xhandler-core-$VERSION.pom" >/dev/null; then
            echo "::notice::$VERSION is already on Maven Central"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !steps.central.outputs.published }}
        run: mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      # Tests, then the artifacts with sources and javadoc into target/staging-deploy
      - if: ${{ !steps.central.outputs.published }}
        run: mvn -B -Ppublication
      - if: ${{ !steps.central.outputs.published }}
        uses: jreleaser/release-action@v2
        with:
          # Signs and publishes to Maven Central; no GitHub release, no announcements
          arguments: deploy
          # The version this configuration was validated with
          version: 1.23.0
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
