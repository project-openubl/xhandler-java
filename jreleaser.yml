project:
  name: xhandler-java
  description: Libreria para crear y enviar XMLs a la SUNAT
  longDescription: Libreria para crear y enviar comprobantes electrónicos a los servicios web de la SUNAT y/o OSCE
  authors:
    - Carlos E. Feria Vila
  license: Apache-2
  languages:
    java:
      groupId: io.github.project-openubl
      version: '17'
  inceptionYear: '2019'
  links:
    homepage: https://project-openubl.github.io/

release:
  github:
    owner: project-openubl
    name: xhandler-java
    # Only deploys to Maven Central: release-tools' release-xhandler workflow creates the tag
    # and the GitHub release
    skipTag: true
    skipRelease: true

signing:
  active: ALWAYS
  pgp:
    armored: true

deploy:
  maven:
    pomchecker:
      failOnWarning: false
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - target/staging-deploy
